[project]
name = "pubop-backend"
version = "0.3.0"
description = "pubop - Global Public Opinion Analysis Platform powered by AI Simulation"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "pubop Team" }
]

dependencies = [
    # Core framework
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    # LLM
    "openai>=1.0.0",
    # Neo4j Graph Database
    "neo4j>=5.23.0",
    # OASIS social simulation
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    # File processing
    "PyMuPDF>=1.24.0",
    # Web scraping (LightPanda CDP client)
    "playwright>=1.40.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.13.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
