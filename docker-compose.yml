services:
  neo4j:
    image: neo4j:5.23.0
    container_name: pubop-neo4j
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/pubop123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Primary: LightPanda - 10x faster, 10x less RAM
  # https://lightpanda.io - AI-native headless browser
  lightpanda:
    image: lightpanda/browser:nightly
    container_name: pubop-lightpanda
    ports:
      - "9222:9222" # Primary CDP endpoint
    environment:
      - LIGHTPANDA_DISABLE_TELEMETRY=true
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9222/json/version || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Fallback: Browserless Chrome - full compatibility for complex JS
  # Use when LightPanda fails on JS-heavy sites (Twitter, Facebook)
  chrome:
    image: browserless/chrome:latest
    container_name: pubop-chrome
    ports:
      - "9223:3000" # Fallback CDP endpoint
    environment:
      - CONNECTION_TIMEOUT=300000
      - MAX_CONCURRENT_SESSIONS=5
      - ENABLE_DEBUGGER=true
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3000/json/version || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:


